name: customer-management-e2e

services:
  postgres-e2e:
    image: postgres:16
    environment:
      POSTGRES_USER: customer_management_e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?Set E2E_DB_PASSWORD in .env.e2e}
      POSTGRES_DB: customer_management_e2e
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_management_e2e -d customer_management_e2e"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  postgres_e2e_data:
